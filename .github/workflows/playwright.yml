name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Best practice: install only the browsers actually used in CI to
      # save download time and disk. See
      # https://playwright.dev/docs/best-practices#optimize-browser-downloads-on-ci
      - name: Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run API tests
        run: npx playwright test --project=api

      - name: Run UI tests (chromium)
        run: npx playwright test --project=ui-chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
