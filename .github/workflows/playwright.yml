name: Playwright tests

# Triggers. Currently manual-only via workflow_dispatch. In addition to manual
# runs, this workflow could also be wired to run on pull_request (e.g. PRs
# targeting main), push (e.g. merges to main or release branches), or schedule
# (cron) for nightly/periodic runs.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Which test tag to run (or All for the full suite).'
        required: true
        default: Smoke
        type: choice
        options:
          - E2E
          - Smoke
          - Regression
          - Negative
          - API Negative
          - UI Negative
      # environment:
      #   description: 'Target environment to run against. Each environment has
      #     its own .env file (e.g. .env.dev, .env.staging, .env.prod) that is
      #     loaded before the tests run.'
      #   required: true
      #   type: choice
      #   options:
      #     - dev
      #     - staging
      #     - prod

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Best practice: install only the browsers actually used in CI to
      # save download time and disk. See
      # https://playwright.dev/docs/best-practices#optimize-browser-downloads-on-ci
      - name: Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Map the human-friendly tag label from the dropdown to the actual
      # `@tag` value used in test annotations. "All" runs the full suite
      # (no --grep filter).
      - name: Resolve grep pattern
        id: grep
        run: |
          case "${{ inputs.tag }}" in
            "All")          echo "pattern=" >> "$GITHUB_OUTPUT" ;;
            "E2E")          echo "pattern=--grep @e2e" >> "$GITHUB_OUTPUT" ;;
            "Smoke")        echo "pattern=--grep @smoke" >> "$GITHUB_OUTPUT" ;;
            "Regression")   echo "pattern=--grep @regression" >> "$GITHUB_OUTPUT" ;;
            "Negative")     echo "pattern=--grep @negative" >> "$GITHUB_OUTPUT" ;;
            "API Negative") echo "pattern=--grep @apiNegative" >> "$GITHUB_OUTPUT" ;;
            "UI Negative")  echo "pattern=--grep @uiNegative" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run API tests
        run: npx playwright test --project=api ${{ steps.grep.outputs.pattern }}

      - name: Run UI tests (chromium)
        run: npx playwright test --project=ui-chromium ${{ steps.grep.outputs.pattern }}

      - name: Run E2E tests
        run: npx playwright test --project=e2e ${{ steps.grep.outputs.pattern }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 4

  docker:
    name: Docker build & smoke run
    needs: test
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t playwright-tests .

      # Run only @smoke inside the container to keep the job fast. This
      # validates that the image is functional without duplicating the full
      # suite that already ran in the `test` job.
      - name: Run smoke tests in Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/playwright-report:/app/playwright-report" \
            playwright-tests \
            npx playwright test --grep @smoke

      - name: Upload Docker smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-smoke-report
          path: playwright-report/
          retention-days: 4
